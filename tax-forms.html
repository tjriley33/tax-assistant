<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms Tracker - Federal Tax Assistant</title>
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0c1220 0%,#1a1035 100%);color:#e8eaf6;min-height:100vh}nav{display:flex;align-items:center;gap:24px;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(12,18,32,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}nav .brand{font-size:16px;font-weight:600;margin-right:auto}nav a{color:#9fa8da;text-decoration:none;font-size:14px;padding:6px 14px;border-radius:6px;transition:all .2s}nav a:hover,nav a.active{color:#e8eaf6;background:rgba(124,77,255,.15)}nav a.active{color:#b388ff}nav button.logout{background:none;border:1px solid rgba(255,255,255,.1);color:#9fa8da;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;margin-left:12px}nav button.logout:hover{color:#e8eaf6;border-color:rgba(255,255,255,.2)}.container{max-width:1200px;margin:0 auto;padding:24px}h1{font-size:24px;margin-bottom:8px;background:linear-gradient(135deg,#7c4dff,#448aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:#9fa8da;margin-bottom:24px;font-size:14px}.filters{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}.filters input,.filters select{padding:10px 14px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.05);color:#e8eaf6;font-size:14px;outline:none}.filters input{flex:1;min-width:200px}.filters input:focus,.filters select:focus{border-color:#7c4dff}.filters select{min-width:140px}.filters select option{background:#1a1035}.stats{display:flex;gap:16px;margin-bottom:20px}.stat-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 20px;flex:1;text-align:center}.stat-card .number{font-size:28px;font-weight:700;color:#7c4dff}.stat-card .label{font-size:12px;color:#9fa8da;margin-top:4px}#forms-table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.03);border-radius:12px;overflow:hidden}#forms-table thead{background:rgba(124,77,255,.1)}#forms-table th{padding:12px 14px;text-align:left;font-size:12px;font-weight:600;color:#b388ff;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none}#forms-table th:hover{color:#e8eaf6}#forms-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}#forms-table tr:hover{background:rgba(255,255,255,.03)}.status-draft{color:#ffab40}.status-final{color:#69f0ae}a{color:#448aff;text-decoration:none}a:hover{text-decoration:underline}.pagination{display:flex;justify-content:center;gap:8px;margin-top:20px}.pagination button{padding:8px 14px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:rgba(255,255,255,.05);color:#e8eaf6;cursor:pointer;font-size:13px}.pagination button:hover{background:rgba(124,77,255,.15)}.pagination button.active{background:#7c4dff;border-color:#7c4dff}.pagination button:disabled{opacity:.3;cursor:not-allowed}.loading{text-align:center;padding:60px;color:#9fa8da}.result-count{color:#9fa8da;font-size:12px;margin-top:8px}@media(max-width:768px){.stats{flex-direction:column}#forms-table{font-size:12px}#forms-table td,#forms-table th{padding:8px 10px}}
#login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0c1220 0%,#1a1035 100%);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:40px;width:380px;text-align:center}
.login-card h1{font-size:24px;margin-bottom:8px;background:linear-gradient(135deg,#7c4dff,#448aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-card p{color:#9fa8da;margin-bottom:24px;font-size:14px}
.login-card input{width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.05);color:#e8eaf6;font-size:16px;margin-bottom:12px;outline:none}
.login-card input:focus{border-color:#7c4dff}
.login-card button{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c4dff,#448aff);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.login-card button:disabled{opacity:.5;cursor:not-allowed}
.login-error{color:#ff5252;font-size:13px;margin-top:12px;display:none}
.login-info{color:#69f0ae;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <h1>Forms Tracker</h1>
    <p>Sign in to continue</p>
    <div id="login-section">
      <input type="email" id="login-email" placeholder="Email" autocomplete="username">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn" onclick="login()">Sign In</button>
    </div>
    <div id="new-password-section" style="display:none">
      <input type="password" id="new-password" placeholder="New password (min 8 chars)" autocomplete="new-password">
      <input type="password" id="new-password-confirm" placeholder="Confirm new password" autocomplete="new-password">
      <button id="new-pw-btn" onclick="completeNewPassword()">Set Password</button>
    </div>
    <div id="login-error" class="login-error"></div>
    <div id="login-info" class="login-info"></div>
  </div>
</div>

<nav style="display:none" id="main-nav">
<span class="brand">Federal Tax Assistant</span>
<a href="/tax-assistant" id="nav-qa">Tax Q&A</a>
<a href="/tax-forms" class="active">Forms Tracker</a>
<a href="/tax-assistant" id="nav-admin">Admin</a>
<span style="color:#9fa8da;font-size:13px;margin-left:auto" id="nav-user"></span>
<button class="logout" onclick="logout()">Sign Out</button>
</nav>
<div class="container" id="main-container" style="display:none">
<h1>IRS Forms Tracker</h1>
<p class="subtitle">Supported federal forms - searchable, filterable, sortable</p>
<div class="stats">
<div class="stat-card"><div class="number" id="total-count">-</div><div class="label">Total Forms</div></div>
<div class="stat-card"><div class="number" id="draft-count">-</div><div class="label">Drafts</div></div>
<div class="stat-card"><div class="number" id="final-count">-</div><div class="label">Final</div></div>
<div class="stat-card"><div class="number" id="recent-count">-</div><div class="label">Last 30 Days</div></div>
</div>
<div class="filters">
<input type="text" id="search" placeholder="Search forms..." oninput="applyFilters()">
<select id="filter-owner" onchange="applyFilters()"><option value="">All Teams</option><option value="FED1040">FED1040</option><option value="K1Fever">K1Fever</option><option value="Backlog Busters">Backlog Busters</option></select>
<select id="filter-status" onchange="applyFilters()"><option value="">All Status</option><option value="Draft">Draft</option><option value="Final">Final</option></select><select id="filter-year" onchange="applyFilters()"><option value="">All Years</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option></select><select id="filter-type" onchange="applyFilters()"><option value="">All Types</option><option value="Form">Form</option><option value="Inst">Instructions</option><option value="Pub">Publication</option></select><select id="filter-product" onchange="applyFilters()"><option value="">All Products</option><option value="1040">1040</option><option value="1065">1065</option><option value="1120">1120</option><option value="1120S">1120S</option><option value="1041">1041</option><option value="990">990</option></select><select id="filter-supported" onchange="applyFilters()"><option value="true">Supported</option><option value="">All Forms</option><option value="false">Unsupported</option></select>
</div>
<div id="table-container"><div class="loading">Loading forms data...</div></div>
<div class="pagination" id="pagination"></div>
</div>

<script>
var COGNITO_POOL_ID='us-east-1_F6AbkUr22',COGNITO_CLIENT_ID='4ul0acfpr4r70sg9nbuj9th3mg';
var userPool=new AmazonCognitoIdentity.CognitoUserPool({UserPoolId:COGNITO_POOL_ID,ClientId:COGNITO_CLIENT_ID});
var currentUser=null,cognitoUserForNewPw=null;

function showError(m){var e=document.getElementById('login-error');e.textContent=m;e.style.display='block';document.getElementById('login-info').style.display='none'}
function showInfo(m){var e=document.getElementById('login-info');e.textContent=m;e.style.display='block';document.getElementById('login-error').style.display='none'}

function onAuthenticated(session,email){
  currentUser=userPool.getCurrentUser();
  if(email)sessionStorage.setItem('taxAssistantEmail',email);
  var displayEmail=email||sessionStorage.getItem('taxAssistantEmail')||'';
  document.getElementById('nav-user').textContent=displayEmail;
  // Hide Q&A / Admin links for forms-only users so the UI matches their access
  var groups=(session.getIdToken().payload['cognito:groups'])||[];
  if(groups.indexOf('forms-only')>=0){
    document.getElementById('nav-qa').style.display='none';
    document.getElementById('nav-admin').style.display='none';
  }
  document.getElementById('login-overlay').style.display='none';
  document.getElementById('main-nav').style.display='flex';
  document.getElementById('main-container').style.display='block';
  load();
}

function login(){
  var email=document.getElementById('login-email').value.trim();
  var password=document.getElementById('login-password').value;
  if(!email||!password){showError('Please enter email and password');return}
  document.getElementById('login-btn').disabled=true;
  var cognitoUser=new AmazonCognitoIdentity.CognitoUser({Username:email,Pool:userPool});
  var authDetails=new AmazonCognitoIdentity.AuthenticationDetails({Username:email,Password:password});
  cognitoUser.authenticateUser(authDetails,{
    onSuccess:function(result){onAuthenticated(result,email);document.getElementById('login-btn').disabled=false},
    onFailure:function(err){showError(err.message||'Login failed');document.getElementById('login-btn').disabled=false},
    newPasswordRequired:function(){
      cognitoUserForNewPw=cognitoUser;
      document.getElementById('login-section').style.display='none';
      document.getElementById('new-password-section').style.display='block';
      showInfo('Your temporary password must be changed.');
      document.getElementById('login-btn').disabled=false;
    }
  });
}

function completeNewPassword(){
  var newPw=document.getElementById('new-password').value;
  var confirmPw=document.getElementById('new-password-confirm').value;
  if(newPw!==confirmPw){showError('Passwords do not match');return}
  if(newPw.length<8){showError('Password must be at least 8 characters');return}
  document.getElementById('new-pw-btn').disabled=true;
  cognitoUserForNewPw.completeNewPasswordChallenge(newPw,{},{
    onSuccess:function(result){
      var email=document.getElementById('login-email').value.trim();
      onAuthenticated(result,email);
      document.getElementById('new-pw-btn').disabled=false;
    },
    onFailure:function(err){showError(err.message||'Failed to set password');document.getElementById('new-pw-btn').disabled=false}
  });
}

function logout(){
  if(currentUser)currentUser.signOut();
  currentUser=null;
  sessionStorage.removeItem('taxAssistantEmail');
  location.reload();
}

// Resume existing session if valid
var existingUser=userPool.getCurrentUser();
if(existingUser){
  existingUser.getSession(function(err,session){
    if(!err&&session&&session.isValid()){
      onAuthenticated(session,sessionStorage.getItem('taxAssistantEmail')||'');
    }
  });
}

document.getElementById('login-password').addEventListener('keypress',function(e){if(e.key==='Enter')login()});
document.getElementById('login-email').addEventListener('keypress',function(e){if(e.key==='Enter')document.getElementById('login-password').focus()});

// ---- Forms tracker ----
var API='https://l3dh3tplmc.execute-api.us-east-1.amazonaws.com/forms',allForms=[],filtered=[],page=1,per=50,sField='date_released',sDir=-1;
async function load(){try{var r=await fetch(API);allForms=await r.json();filtered=allForms;stats();applyFilters()}catch(e){document.getElementById('table-container').textContent='Error loading.'}}
function stats(){var sp=document.getElementById('filter-supported').value;var base=allForms.filter(function(f){if(sp==='true'&&!f.supported)return false;if(sp==='false'&&f.supported)return false;return true});document.getElementById('total-count').textContent=base.length;document.getElementById('draft-count').textContent=base.filter(f=>f.status==='Draft').length;document.getElementById('final-count').textContent=base.filter(f=>f.status==='Final').length;var d=new Date();d.setDate(d.getDate()-30);var c=d.toISOString().slice(0,10);document.getElementById('recent-count').textContent=base.filter(f=>(f.date_released||'')>c).length}
function applyFilters(){stats();var s=document.getElementById('search').value.toLowerCase(),o=document.getElementById('filter-owner').value,st=document.getElementById('filter-status').value,yr=document.getElementById('filter-year').value;filtered=allForms.filter(f=>{if(s&&!(f.form_desc||'').toLowerCase().includes(s)&&!(f.owner||'').toLowerCase().includes(s))return false;if(o&&(f.owner||'').indexOf(o)===-1)return false;if(st&&f.status!==st)return false;if(yr&&!(f.form_desc||'').startsWith(yr)&&!(f.date_released||'').startsWith(yr))return false;var tp=document.getElementById('filter-type').value;if(tp==='Form'&&!f.Is_Form)return false;if(tp==='Inst'&&!f.Inst)return false;if(tp==='Pub'&&!f.Pub)return false;var pr=document.getElementById('filter-product').value;if(pr&&!(f['is_'+pr]||''))return false;var sp=document.getElementById('filter-supported').value;if(sp==='true'&&!f.supported)return false;if(sp==='false'&&f.supported)return false;return true});filtered.sort((a,b)=>{var va=a[sField]||'',vb=b[sField]||'';return va>vb?sDir:va<vb?-sDir:0});page=1;render();pager()}
function sortBy(f){if(sField===f)sDir*=-1;else{sField=f;sDir=-1}applyFilters()}
function render(){var st=(page-1)*per,pg=filtered.slice(st,st+per),c=document.getElementById('table-container');while(c.firstChild)c.removeChild(c.firstChild);var t=document.createElement('table');t.id='forms-table';var th=document.createElement('thead');var hr=document.createElement('tr');['Form','Released','Status','Type','Owner','Link','1040','1065','1120','1041','990'].forEach(function(h,i){var td=document.createElement('th');td.textContent=h;var fields=['form_desc','date_released','status','','owner','','is_1040','is_1065','is_1120','is_1041','is_990'];if(fields[i])td.onclick=function(){sortBy(fields[i])};hr.appendChild(td)});th.appendChild(hr);t.appendChild(th);var tb=document.createElement('tbody');pg.forEach(function(f){var r=document.createElement('tr');var desc=(f.form_desc||'?').replace(/ \(PDF\)/g,'').trim();var ftype=f.Is_Form?'Form':f.Inst?'Inst':f.Pub?'Pub':'';var vals=[desc,(f.date_released||'').slice(0,10),f.status||'?',ftype,f.owner||'Unknown','link',f.is_1040||'',f.is_1065||'',f.is_1120||'',f.is_1041||'',f.is_990||''];vals.forEach(function(v,i){var td=document.createElement('td');if(i===2)td.className=v==='Draft'?'status-draft':'status-final';if(i===5){var a=document.createElement('a');a.href=f.url||'#';a.target='_blank';a.textContent=(f.url||'').split('/').pop();td.appendChild(a)}else{td.textContent=v}r.appendChild(td)});tb.appendChild(r)});t.appendChild(tb);c.appendChild(t);var p=document.createElement('p');p.className='result-count';p.textContent='Showing '+(st+1)+'-'+Math.min(st+per,filtered.length)+' of '+filtered.length+' forms';c.appendChild(p)}
function pager(){var tp=Math.ceil(filtered.length/per),c=document.getElementById('pagination');while(c.firstChild)c.removeChild(c.firstChild);if(tp<=1)return;var pb=document.createElement('button');pb.textContent='Prev';pb.disabled=page===1;pb.onclick=function(){page--;render();pager()};c.appendChild(pb);var ms=Math.max(1,page-3),me=Math.min(tp,ms+6);for(var i=ms;i<=me;i++){var b=document.createElement('button');b.textContent=i;if(i===page)b.className='active';b.onclick=(function(p){return function(){page=p;render();pager()}})(i);c.appendChild(b)}var nb=document.createElement('button');nb.textContent='Next';nb.disabled=page===tp;nb.onclick=function(){page++;render();pager()};c.appendChild(nb)}
</script>
</body>
</html>
